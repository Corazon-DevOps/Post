<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Post - Seminário Prático Penal 2026</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(160deg, #06101f 0%, #0f1c33 40%, #0a1525 100%);
      min-height: 100vh;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 12px 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 380px;
      padding: 0 8px;
    }
    .header h1 {
      font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .header p {
      font-size: clamp(0.7rem, 2.8vw, 0.875rem);
      color: #94a3b8;
      margin-top: 6px;
    }
    .card-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .card-container {
      position: relative;
      width: 100%;
      max-width: min(420px, 94vw);
      aspect-ratio: 3277 / 4096;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
      border-radius: 6px;
      overflow: hidden;
      background-color: #0a1628;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .photo-frame {
      position: absolute;
      left: 19.5%;
      top: 22.5%;
      width: 61%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      z-index: 20;
      cursor: pointer;
      border: 5px solid #d4af37;
      box-shadow:
        0 0 0 2px #f5e6a3,
        0 0 18px rgba(212, 175, 55, 0.55),
        inset 0 0 10px rgba(0,0,0,0.2);
      background: #0f172a;
      transition: box-shadow 0.2s ease;
    }
    .photo-frame:hover {
      box-shadow:
        0 0 0 2px #f5e6a3,
        0 0 24px rgba(212, 175, 55, 0.7),
        inset 0 0 10px rgba(0,0,0,0.2);
    }
    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: center center;
    }
    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      color: #e2e8f0;
      text-align: center;
      padding: 14px;
      gap: 10px;
    }
    .placeholder svg { width: 48px; height: 48px; opacity: 0.9; }
    .placeholder span {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      max-width: 85%;
    }
    .curved-text-wrap {
      position: absolute;
      left: 12%;
      top: 10%;
      width: 76%;
      height: 55%;
      z-index: 25;
      pointer-events: none;
      overflow: visible;
    }
    .curved-text-wrap svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }
    .hashtag-outline,
    .hashtag {
      position: absolute;
      left: 50%;
      bottom: 14.5%;
      transform: translateX(-50%);
      font-size: clamp(42px, 14vw, 68px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      font-family: 'Montserrat', Arial Black, sans-serif;
    }
    /* Camada branca grossa (contorno) - funciona bem no html2canvas */
    .hashtag-outline {
      z-index: 29;
      color: #ffffff;
      text-shadow:
        -3px -3px 0 #fff,
         3px -3px 0 #fff,
        -3px  3px 0 #fff,
         3px  3px 0 #fff,
        -3px  0   0 #fff,
         3px  0   0 #fff,
         0   -3px 0 #fff,
         0    3px 0 #fff,
        -2px -2px 0 #fff,
         2px -2px 0 #fff,
        -2px  2px 0 #fff,
         2px  2px 0 #fff;
    }
    /* Preenchimento escuro por cima */
    .hashtag {
      z-index: 30;
      color: #0b1a2e;
      text-shadow: none;
      -webkit-text-stroke: 0;
    }
    .footer-bar {
      position: absolute;
      left: 0; right: 0; bottom: 4.2%;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 6%;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f0e6c8;
      font-size: clamp(9px, 2.5vw, 11.5px);
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .footer-item svg { width: 13px; height: 13px; flex-shrink: 0; color: #d4af37; }
    .footer-divider {
      width: 1px; height: 14px;
      background: rgba(212, 175, 55, 0.55);
      flex-shrink: 0;
    }
    .exporting-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 16, 31, 0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
      border-radius: 6px;
    }
    .exporting-overlay .spinner {
      width: 44px; height: 44px;
      border: 4px solid #facc15;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .exporting-overlay p { font-weight: 600; font-size: 14px; text-align: center; }
    .controls {
      width: 100%;
      max-width: 420px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 4px;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fecaca;
      font-size: 14px;
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
    }
    .adjust-panel {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .adjust-title {
      font-size: 11px;
      font-weight: 700;
      color: rgba(250, 204, 21, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-align: center;
    }
    .slider-row label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .slider-row label span:last-child { font-variant-numeric: tabular-nums; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      background: #d4af37;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.55);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px;
      background: #d4af37;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .btn-row { flex-direction: row; }
    }
    .btn-primary {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e0c35a 0%, #d4af37 45%, #b8860b 100%);
      color: #0f172a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.45);
      transition: all 0.2s ease;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(212, 175, 55, 0.55);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      background: transparent;
      border: 2px solid #d4af37;
      color: #d4af37;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover { background: rgba(212, 175, 55, 0.12); }
    .privacy-note {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
      padding-top: 4px;
    }
    .hidden-input { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { useState, useRef, useCallback, createElement: h } = React;

    function CameraIcon() {
      return h('svg', { xmlns: 'http://www.w3.org/2000/svg', fill: 'none', viewBox: '0 0 24 24', strokeWidth: 1.5, stroke: 'currentColor' },
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.055-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z' }),
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z' })
      );
    }

    function DownloadIcon() {
      return h('svg', { xmlns: 'http://www.w3.org/2000/svg', fill: 'none', viewBox: '0 0 24 24', stroke: 'currentColor', strokeWidth: 2.5 },
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4' })
      );
    }

    function CalendarIcon() {
      return h('svg', { xmlns: 'http://www.w3.org/2000/svg', fill: 'none', viewBox: '0 0 24 24', strokeWidth: 2, stroke: 'currentColor' },
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5' })
      );
    }

    function LocationIcon() {
      return h('svg', { xmlns: 'http://www.w3.org/2000/svg', fill: 'none', viewBox: '0 0 24 24', strokeWidth: 2, stroke: 'currentColor' },
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M15 10.5a3 3 0 11-6 0 3 3 0 016 0z' }),
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z' })
      );
    }

    function App() {
      const [photoUrl, setPhotoUrl] = useState(null);
      const [scale, setScale] = useState(1.1);
      const [posX, setPosX] = useState(50);
      const [posY, setPosY] = useState(38);
      const [exporting, setExporting] = useState(false);
      const [error, setError] = useState(null);
      const cardRef = useRef(null);
      const fileInputRef = useRef(null);

      const handleFileChange = function(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          setError('Por favor, selecione uma imagem válida (JPG, PNG, etc).');
          return;
        }
        setError(null);
        const reader = new FileReader();
        reader.onload = function(ev) {
          setPhotoUrl(ev.target.result);
          setScale(1.15);
          setPosX(50);
          setPosY(38);
        };
        reader.readAsDataURL(file);
      };

      const triggerUpload = function() {
        if (fileInputRef.current) fileInputRef.current.click();
      };

      const handleDownload = useCallback(async function() {
        if (!photoUrl) {
          setError('Envie sua foto primeiro para gerar o post!');
          return;
        }
        if (!cardRef.current) return;
        setExporting(true);
        setError(null);
        try {
          // Wait for React to paint the overlay, then hide it from the card before capture
          await new Promise(function(r) { setTimeout(r, 50); });
          var overlay = cardRef.current && cardRef.current.querySelector('.exporting-overlay');
          if (overlay) {
            overlay.style.display = 'none';
          }
          await new Promise(function(r) { setTimeout(r, 50); });
          var card = cardRef.current;
          // Alta definição: scale 5 × largura do card (~420px) ≈ 2100px de largura
          // Proporção retrato ~ 2100 × 2625 px — excelente para Instagram/Feed
          const canvas = await html2canvas(card, {
            scale: 5,
            useCORS: true,
            allowTaint: true,
            backgroundColor: null,
            logging: false,
            imageTimeout: 45000,
            ignoreElements: function(el) {
              return el.classList && el.classList.contains('exporting-overlay');
            }
          });

          const link = document.createElement('a');
          link.download = 'meu-post-seminario-penal.png';
          link.href = canvas.toDataURL('image/png', 1.0);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) {
          console.error(err);
          setError('Erro ao gerar a imagem. Tente novamente.');
        } finally {
          setExporting(false);
        }
      }, [photoUrl]);

      const resetPhoto = function() {
        setPhotoUrl(null);
        setScale(1.1);
        setPosX(50);
        setPosY(38);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      var photoContent;
      if (photoUrl) {
        photoContent = h('img', {
          src: photoUrl, alt: 'Sua foto', className: 'photo-img',
          style: { transform: 'scale(' + scale + ')', objectPosition: posX + '% ' + posY + '%' },
          draggable: false
        });
      } else {
        photoContent = h('div', { className: 'placeholder' },
          h(CameraIcon),
          h('span', null, 'Clique aqui para', h('br'), 'enviar sua foto')
        );
      }

      var adjustPanel = null;
      if (photoUrl) {
        adjustPanel = h('div', { className: 'adjust-panel' },
          h('p', { className: 'adjust-title' }, 'Ajuste sua foto'),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Zoom'), h('span', null, Math.round(scale * 100) + '%')),
            h('input', { type: 'range', min: '1', max: '2.4', step: '0.05', value: scale,
              onChange: function(e) { setScale(parseFloat(e.target.value)); } })
          ),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Horizontal')),
            h('input', { type: 'range', min: '0', max: '100', step: '1', value: posX,
              onChange: function(e) { setPosX(parseInt(e.target.value, 10)); } })
          ),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Vertical')),
            h('input', { type: 'range', min: '0', max: '100', step: '1', value: posY,
              onChange: function(e) { setPosY(parseInt(e.target.value, 10)); } })
          )
        );
      }

      var secondaryBtn = photoUrl
        ? h('button', { className: 'btn-secondary', onClick: resetPhoto }, 'Trocar Foto')
        : h('button', { className: 'btn-secondary', onClick: triggerUpload }, 'Enviar Foto');

      return h('div', { className: 'page' },
        h('div', { className: 'header' },
          h('h1', null, 'Crie seu Post Personalizado'),
          h('p', null, '2ª Edição • Seminário Prático Penal Sul Capixaba 2026')
        ),
        h('div', { className: 'card-wrap' },
          h('div', { ref: cardRef, className: 'card-container' },
            h('img', { src: 'background.jpg', alt: '', className: 'bg-image', draggable: false, onError: function(e) { e.target.style.background = '#0a1628'; console.warn('Fundo nao carregou - verifique se background.jpg esta na mesma pasta do index.html'); } }),
            h('div', {
              className: 'photo-frame',
              onClick: !photoUrl ? triggerUpload : undefined,
              role: 'button', tabIndex: 0,
              'aria-label': photoUrl ? 'Área da foto' : 'Clique para enviar sua foto',
              onKeyDown: function(e) {
                if ((e.key === 'Enter' || e.key === ' ') && !photoUrl) { e.preventDefault(); triggerUpload(); }
              }
            }, photoContent),
            h('div', { className: 'hashtag-outline', 'aria-hidden': 'true' }, '#EUVOU'),
            h('div', { className: 'hashtag' }, '#EUVOU'),
            h('div', { className: 'footer-bar' },
              h('div', { className: 'footer-item' }, h(CalendarIcon), h('span', null, '21 E 22 DE AGOSTO DE 2026')),
              h('div', { className: 'footer-divider' }),
              h('div', { className: 'footer-item' }, h(LocationIcon), h('span', null, 'CACHOEIRO DE ITAPEMIRIM-ES'))
            ),
            exporting ? h('div', { className: 'exporting-overlay' },
              h('div', null, h('div', { className: 'spinner' }), h('p', null, 'Gerando seu post...'))
            ) : null
          )
        ),
        h('div', { className: 'controls' },
          error ? h('div', { className: 'error-box' }, error) : null,
          adjustPanel,
          h('div', { className: 'btn-row' },
            h('button', { className: 'btn-primary', onClick: handleDownload, disabled: !photoUrl || exporting },
              h(DownloadIcon), 'Baixar Meu Post'
            ),
            secondaryBtn
          ),
          h('p', { className: 'privacy-note' },
            'Sua foto permanece apenas no seu dispositivo.', h('br'), 'Nada é enviado para servidores.'
          )
        ),
        h('input', {
          ref: fileInputRef, type: 'file', accept: 'image/*',
          className: 'hidden-input', onChange: handleFileChange
        })
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
