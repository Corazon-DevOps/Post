    function App() {
      const [photoUrl, setPhotoUrl] = useState(null);
      const [scale, setScale] = useState(1.1);
      const [posX, setPosX] = useState(50);
      const [posY, setPosY] = useState(38);
      const [previewMode, setPreviewMode] = useState('feed'); // 'feed' | 'story'
      const [exporting, setExporting] = useState(false);
      const [processing, setProcessing] = useState(false);
      const [error, setError] = useState(null);
      const cardRef = useRef(null);
      const fileInputRef = useRef(null);

      const handleFileChange = function(e) {
        var inputEl = e.target;
        var file = inputEl.files && inputEl.files[0];
        // limpa para poder reescolher a mesma foto
        try { inputEl.value = ''; } catch (err) {}
        if (!file) return;

        setError(null);
        setProcessing(true);

        var MAX_SIDE = 1200;

        function isProbablyHeic(f) {
          var t = (f.type || '').toLowerCase();
          var n = (f.name || '').toLowerCase();
          return t.indexOf('heic') >= 0 || t.indexOf('heif') >= 0 || /\.heic$|\.heif$/i.test(n);
        }

        function ensureDecodableFile(f) {
          if (!isProbablyHeic(f) || typeof heic2any === 'undefined') {
            return Promise.resolve(f);
          }
          return heic2any({ blob: f, toType: 'image/jpeg', quality: 0.9 })
            .then(function(result) {
              var blob = Array.isArray(result) ? result[0] : result;
              return new File([blob], (f.name || 'foto').replace(/\.heic$/i, '.jpg').replace(/\.heif$/i, '.jpg'), { type: 'image/jpeg' });
            })
            .catch(function(err) {
              console.warn('heic2any fail', err);
              return f;
            });
        }

        function applyPhoto(dataUrl) {
          if (!dataUrl) {
            setProcessing(false);
            setError('Não foi possível carregar esta foto. Tente outra.');
            return;
          }
          // testa se o browser consegue EXIBIR a imagem antes de fixar no estado
          var testImg = new Image();
          testImg.onload = function() {
            setPhotoUrl(dataUrl);
            setScale(1.1);
            setPosX(50);
            setPosY(40);
            setProcessing(false);
            setError(null);
          };
          testImg.onerror = function() {
            // dataURL inválido para <img> — tenta blob URL direto do arquivo
            try {
              var blobUrl = URL.createObjectURL(file);
              var test2 = new Image();
              test2.onload = function() {
                setPhotoUrl(blobUrl);
                setScale(1.1);
                setPosX(50);
                setPosY(40);
                setProcessing(false);
                setError(null);
              };
              test2.onerror = function() {
                URL.revokeObjectURL(blobUrl);
                setProcessing(false);
                setError('Este formato não é suportado neste aparelho. Salve como JPG na galeria e tente de novo.');
              };
              test2.src = blobUrl;
            } catch (e2) {
              setProcessing(false);
              setError('Não foi possível usar esta foto. Tente JPG ou PNG.');
            }
          };
          testImg.src = dataUrl;
        }

        function drawToJpeg(source, srcW, srcH) {
          var w = srcW || source.naturalWidth || source.width || source.videoWidth;
          var h = srcH || source.naturalHeight || source.height || source.videoHeight;
          if (!w || !h) throw new Error('no-dimensions');

          // reduz em passos (mobile)
          var tw = w, th = h;
          var steps = 0;
          while ((tw > MAX_SIDE * 2 || th > MAX_SIDE * 2) && steps < 6) {
            tw = Math.max(1, Math.round(tw / 2));
            th = Math.max(1, Math.round(th / 2));
            steps++;
          }
          if (tw > MAX_SIDE || th > MAX_SIDE) {
            var sc = MAX_SIDE / Math.max(tw, th);
            tw = Math.max(1, Math.round(tw * sc));
            th = Math.max(1, Math.round(th * sc));
          }

          var canvas = document.createElement('canvas');
          canvas.width = tw;
          canvas.height = th;
          var ctx = canvas.getContext('2d', { alpha: false });
          if (!ctx) throw new Error('no-ctx');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, tw, th);
          ctx.imageSmoothingEnabled = true;
          try { ctx.imageSmoothingQuality = 'high'; } catch (e) {}
          ctx.drawImage(source, 0, 0, tw, th);

          var q = file.size > 10 * 1024 * 1024 ? 0.75 : 0.85;
          var out = canvas.toDataURL('image/jpeg', q);
          if (!out || out.length < 50) throw new Error('empty-dataurl');
          return out;
        }

        function fromBlobUrl() {
          return new Promise(function(resolve, reject) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            var done = false;
            var timer = setTimeout(function() {
              if (done) return;
              done = true;
              URL.revokeObjectURL(url);
              reject(new Error('timeout-blob'));
            }, 12000);
            img.onload = function() {
              if (done) return;
              done = true;
              clearTimeout(timer);
              try {
                var jpeg = drawToJpeg(img);
                URL.revokeObjectURL(url);
                resolve(jpeg);
              } catch (err) {
                // se canvas falhar, usa o blob URL direto (ainda mostra a foto)
                resolve(url);
              }
            };
            img.onerror = function() {
              if (done) return;
              done = true;
              clearTimeout(timer);
              URL.revokeObjectURL(url);
              reject(new Error('blob-decode'));
            };
            img.src = url;
          });
        }

        function fromFileReader() {
          return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(ev) {
              var data = ev.target.result;
              var img = new Image();
              img.onload = function() {
                try {
                  resolve(drawToJpeg(img));
                } catch (err) {
                  resolve(data); // usa dataURL original
                }
              };
              img.onerror = function() {
                // não decodificou no Image, mas dataURL pode funcionar em alguns casos
                resolve(data);
              };
              img.src = data;
            };
            reader.onerror = function() { reject(new Error('filereader')); };
            try {
              reader.readAsDataURL(file);
            } catch (err) {
              reject(err);
            }
          });
        }

        function fromBitmap() {
          if (typeof createImageBitmap !== 'function') {
            return Promise.reject(new Error('no-bitmap'));
          }
          return createImageBitmap(file)
            .then(function(bmp) {
              try {
                var jpeg = drawToJpeg(bmp, bmp.width, bmp.height);
                if (bmp.close) bmp.close();
                return jpeg;
              } catch (err) {
                if (bmp.close) bmp.close();
                throw err;
              }
            });
        }

        // Converte HEIC se preciso, depois decodifica (ignora extensão falsa)
        ensureDecodableFile(file).then(function(decodedFile) {
          file = decodedFile;
          return fromFileReader()
            .catch(function() { return fromBlobUrl(); })
            .catch(function() { return fromBitmap(); });
        })
          .then(function(result) { applyPhoto(result); })
          .catch(function(err) {
            console.error('upload fail', err);
            try {
              var raw = URL.createObjectURL(file);
              setPhotoUrl(raw);
              setScale(1.1);
              setPosX(50);
              setPosY(40);
              setProcessing(false);
              setError(null);
            } catch (e3) {
              setProcessing(false);
              setError('Falha ao carregar a foto. Tente outro arquivo (JPG/PNG).');
            }
          });
      };

      const triggerUpload = function() {
        if (fileInputRef.current) fileInputRef.current.click();
      };

      const handleDownload = useCallback(async function(mode) {
        if (!photoUrl) {
          setError('Envie sua foto primeiro para gerar o post!');
          return;
        }
        if (!cardRef.current) return;
        mode = mode || 'feed';
        setPreviewMode(mode);
        setExporting(true);
        setError(null);
        try {
          // Aguarda React aplicar o fundo/proporção do modo (feed ou story)
          await new Promise(function(r) { setTimeout(r, 200); });
          var overlay = cardRef.current && cardRef.current.querySelector('.exporting-overlay');
          if (overlay) overlay.style.display = 'none';
          await new Promise(function(r) { setTimeout(r, 100); });

          var card = cardRef.current;
          // Escala alta: story precisa de mais resolução (card mais estreito na tela)
          var captureScale = mode === 'story' ? 7 : 5;
          var sourceCanvas = await html2canvas(card, {
            scale: captureScale,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#0a1628',
            logging: false,
            imageTimeout: 60000,
            ignoreElements: function(el) {
              return el.classList && el.classList.contains('exporting-overlay');
            }
          });

          // Instagram: Story 9:16 | Feed 4:5
          // Story exporta em 2x (2160x3840) para nitidez máxima ao comprimir no IG
          var targetW, targetH, fileSuffix;
          if (mode === 'story') {
            targetW = 2160; targetH = 3840; fileSuffix = 'story';
          } else {
            targetW = 1080; targetH = 1350; fileSuffix = 'feed';
          }

          var out = document.createElement('canvas');
          out.width = targetW;
          out.height = targetH;
          var ctx = out.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.fillStyle = '#0a1628';
          ctx.fillRect(0, 0, targetW, targetH);

          // Redimensiona a captura em alta qualidade para o tamanho final
          ctx.drawImage(sourceCanvas, 0, 0, targetW, targetH);

          var link = document.createElement('a');
          link.download = 'meu-post-seminario-penal-' + fileSuffix + '.png';
          link.href = out.toDataURL('image/png', 1.0);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) {
          console.error(err);
          setError('Erro ao gerar a imagem. Tente novamente.');
        } finally {
          setExporting(false);
        }
      }, [photoUrl]);

      const resetPhoto = function() {
        setPhotoUrl(null);
        setScale(1.1);
        setPosX(50);
        setPosY(38);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      var photoContent;
      if (photoUrl) {
        photoContent = h('img', {
          src: photoUrl,
          alt: 'Sua foto',
          className: 'photo-img',
          style: {
            transform: 'scale(' + scale + ')',
            WebkitTransform: 'scale(' + scale + ')',
            objectPosition: posX + '% ' + posY + '%',
            objectFit: 'cover',
            width: '100%',
            height: '100%'
          },
          draggable: false,
          onError: function() {
            setError('A foto foi lida, mas não pôde ser exibida. Tente salvar como JPG e enviar de novo.');
          }
        });
      } else if (processing) {
        photoContent = h('div', { className: 'placeholder' },
          h('div', { className: 'spinner', style: { width: '36px', height: '36px', marginBottom: '8px' } }),
          h('span', null, 'Processando foto...')
        );
      } else {
        photoContent = h('div', { className: 'placeholder' },
          h(CameraIcon),
          h('span', null, 'Toque aqui para', h('br'), 'enviar sua foto')
        );
      }

      var adjustPanel = null;
      if (photoUrl) {
        adjustPanel = h('div', { className: 'adjust-panel' },
          h('p', { className: 'adjust-title' }, 'Ajuste sua foto'),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Zoom'), h('span', null, Math.round(scale * 100) + '%')),
            h('input', { type: 'range', min: '1', max: '2.4', step: '0.05', value: scale,
              onChange: function(e) { setScale(parseFloat(e.target.value)); } })
          ),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Horizontal')),
            h('input', { type: 'range', min: '0', max: '100', step: '1', value: posX,
              onChange: function(e) { setPosX(parseInt(e.target.value, 10)); } })
          ),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Vertical')),
            h('input', { type: 'range', min: '0', max: '100', step: '1', value: posY,
              onChange: function(e) { setPosY(parseInt(e.target.value, 10)); } })
          )
        );
      }

      var secondaryBtn = photoUrl
        ? h('button', { className: 'btn-secondary', type: 'button', onClick: resetPhoto }, 'Trocar Foto')
        : h('label', {
            htmlFor: 'photo-upload-input',
            className: 'btn-secondary',
            style: { cursor: 'pointer' }
          }, 'Enviar Foto');

      return h('div', { className: 'page' },
        h('div', { className: 'header' },
          h('h1', null, 'Crie seu Post Personalizado'),
          h('p', null, '2ª Edição • Seminário Prático Penal Sul Capixaba 2026')
        ),
        h('div', { className: 'card-wrap' },
          h('div', {
            ref: cardRef,
            className: 'card-container' + (previewMode === 'story' ? ' card-story' : ' card-feed'),
            style: {
              aspectRatio: previewMode === 'story' ? '9 / 16' : '1199 / 1500',
              backgroundImage: previewMode === 'story'
                ? "url('background-story-1080.jpg')"
                : "url('background.jpg')"
            }
          },
            h('img', {
              src: previewMode === 'story' ? 'background-story-1080.jpg' : 'background.jpg',
              alt: '',
              className: 'bg-image',
              draggable: false,
              onError: function(e) {
                e.target.style.display = 'none';
                console.warn('Fundo nao carregou');
              }
            }),
            h('div', {
              className: 'photo-frame',
              role: photoUrl ? 'img' : 'button',
              'aria-label': photoUrl ? 'Área da foto' : 'Toque para enviar sua foto',
              style: previewMode === 'story' ? {
                top: '24%',
                width: '66%',
                left: '17%'
              } : undefined
            },
              photoContent,
              // Label invisível sobre o círculo: funciona no iOS/Android (melhor que click() JS)
              !photoUrl ? h('label', {
                htmlFor: 'photo-upload-input',
                className: 'photo-label',
                'aria-hidden': true
              }) : null
            ),
            h('div', {
              className: 'hashtag-outline',
              'aria-hidden': 'true',
              style: previewMode === 'story'
                ? { bottom: '30%', fontSize: 'clamp(36px, 12vw, 58px)', zIndex: 35 }
                : undefined
            }, '#EUVOU'),
            h('div', {
              className: 'hashtag',
              style: previewMode === 'story'
                ? { bottom: '30%', fontSize: 'clamp(36px, 12vw, 58px)', zIndex: 36 }
                : undefined
            }, '#EUVOU'),
                        exporting ? h('div', { className: 'exporting-overlay' },
              h('div', null, h('div', { className: 'spinner' }), h('p', null, 'Gerando seu post...'))
            ) : null
          )
        ),
        h('div', { className: 'controls' },
          error ? h('div', { className: 'error-box' }, error) : null,
          adjustPanel,
          h('div', { className: 'mode-toggle' },
            h('button', {
              type: 'button',
              className: 'mode-btn' + (previewMode === 'feed' ? ' mode-btn-active' : ''),
              onClick: function() { setPreviewMode('feed'); }
            }, 'Feed 4:5'),
            h('button', {
              type: 'button',
              className: 'mode-btn' + (previewMode === 'story' ? ' mode-btn-active' : ''),
              onClick: function() { setPreviewMode('story'); }
            }, 'Story 9:16')
          ),
          h('div', { className: 'btn-row btn-row-modes' },
            h('button', {
              className: 'btn-primary',
              type: 'button',
              onClick: function() { setPreviewMode('feed'); handleDownload('feed'); },
              disabled: !photoUrl || exporting
            }, h(DownloadIcon), 'Salvar Feed'),
            h('button', {
              className: 'btn-primary btn-story',
              type: 'button',
              onClick: function() { setPreviewMode('story'); handleDownload('story'); },
              disabled: !photoUrl || exporting
            }, h(DownloadIcon), 'Salvar Story')
          ),
          h('div', { className: 'btn-row' },
            secondaryBtn
          ),
          h('p', { className: 'privacy-note' },
            'Sua foto permanece apenas no seu dispositivo.', h('br'), 'Nada é enviado para servidores.'
          ),
          h('p', { className: 'dev-credit' },
            'Desenvolvido por ',
            h('a', {
              href: 'https://cora-devops.vercel.app/',
              target: '_blank',
              rel: 'noopener noreferrer',
              className: 'dev-link'
            }, 'Cora DevOps')
          )
        ),
        h('input', {
          ref: fileInputRef, id: 'photo-upload-input', type: 'file', accept: 'image/*,*/*',
          className: 'hidden-input', onChange: handleFileChange
        })
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
