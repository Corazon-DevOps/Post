        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M15 10.5a3 3 0 11-6 0 3 3 0 016 0z' }),
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z' })

    function App() {
      const [photoUrl, setPhotoUrl] = useState(null);
      const [scale, setScale] = useState(1.1);
      const [posX, setPosX] = useState(50);
      const [posY, setPosY] = useState(38);
      const [previewMode, setPreviewMode] = useState('feed'); // 'feed' | 'story'
      const [exporting, setExporting] = useState(false);
      const [processing, setProcessing] = useState(false);
      const [error, setError] = useState(null);
      const cardRef = useRef(null);
      const fileInputRef = useRef(null);

      const handleFileChange = function(e) {
        const file = e.target.files && e.target.files[0];
        // permite selecionar a mesma foto de novo depois
        if (e.target) e.target.value = '';
        if (!file) return;

        var name = (file.name || '').toLowerCase();
        var type = (file.type || '').toLowerCase();
        var okType =
          type.indexOf('image/') === 0 ||
          type === '' ||
          type === 'application/octet-stream' ||
          /\.(jpe?g|png|gif|webp|bmp|heic|heif|tif{1,2}|avif|svg)$/i.test(name);
        if (!okType) {
          setError('Formato não suportado. Use JPG, PNG, WEBP ou HEIC.');
          return;
        }

        // Aviso amigável para arquivos muito grandes (ainda tenta processar)
        if (file.size > 25 * 1024 * 1024) {
          setError('Foto muito grande (máx. recomendado 25 MB). Comprimindo…');
        } else {
          setError(null);
        }
        setProcessing(true);

        var MAX_SIDE = 1400; // seguro p/ iOS Safari (limite de canvas)

        function finishOk(dataUrl) {
          setPhotoUrl(dataUrl);
          setScale(1.15);
          setPosX(50);
          setPosY(38);
          setProcessing(false);
          setError(null);
        }

        function finishErr(msg) {
          console.error(msg);
          setProcessing(false);
          setError(msg || 'Não foi possível usar esta foto. Tente outra ou salve como JPG.');
        }

        function canvasFromImageSource(source, srcW, srcH) {
          var w = srcW || source.naturalWidth || source.width;
          var h = srcH || source.naturalHeight || source.height;
          if (!w || !h) throw new Error('Dimensões inválidas');

          // Reduz em passos (evita estouro de memória no mobile)
          var tw = w, th = h;
          while (tw > MAX_SIDE * 2 || th > MAX_SIDE * 2) {
            tw = Math.round(tw / 2);
            th = Math.round(th / 2);
          }
          if (tw > MAX_SIDE || th > MAX_SIDE) {
            var s = MAX_SIDE / Math.max(tw, th);
            tw = Math.round(tw * s);
            th = Math.round(th * s);
          }
          tw = Math.max(1, tw);
          th = Math.max(1, th);

          var canvas = document.createElement('canvas');
          canvas.width = tw;
          canvas.height = th;
          var ctx = canvas.getContext('2d');
          if (!ctx) throw new Error('Canvas indisponível');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(source, 0, 0, tw, th);

          // JPEG com qualidade adaptativa
          var q = 0.88;
          if (file.size > 8 * 1024 * 1024) q = 0.8;
          if (file.size > 15 * 1024 * 1024) q = 0.72;

          var dataUrl;
          try {
            dataUrl = canvas.toDataURL('image/jpeg', q);
          } catch (e1) {
            // fallback sem qualidade / png menor
            canvas.width = Math.min(tw, 1000);
            canvas.height = Math.min(th, 1000);
            ctx = canvas.getContext('2d');
            ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
            dataUrl = canvas.toDataURL('image/jpeg', 0.7);
          }
          if (!dataUrl || dataUrl.length < 100) throw new Error('Falha ao gerar preview');
          return dataUrl;
        }

        function loadViaObjectURL() {
          return new Promise(function(resolve, reject) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            // ajuda em alguns Android
            img.decoding = 'async';
            img.onload = function() {
              try {
                var dataUrl = canvasFromImageSource(img);
                URL.revokeObjectURL(url);
                resolve(dataUrl);
              } catch (err) {
                URL.revokeObjectURL(url);
                reject(err);
              }
            };
            img.onerror = function() {
              URL.revokeObjectURL(url);
              reject(new Error('decode-object-url'));
            };
            img.src = url;
          });
        }

        function loadViaFileReader() {
          return new Promise(function(resolve, reject) {
            var reader = new FileReader();
            reader.onload = function(ev) {
              var img = new Image();
              img.onload = function() {
                try {
                  resolve(canvasFromImageSource(img));
                } catch (err) {
                  // último recurso: usa dataURL cru (pode falhar em HEIC no <img>)
                  resolve(ev.target.result);
                }
              };
              img.onerror = function() {
                // se o browser não decodifica (ex: HEIC), tenta usar o dataURL mesmo assim
                if (ev.target && ev.target.result) {
                  resolve(ev.target.result);
                } else {
                  reject(new Error('decode-filereader'));
                }
              };
              img.src = ev.target.result;
            };
            reader.onerror = function() { reject(new Error('read-failed')); };
            reader.readAsDataURL(file);
          });
        }

        function loadViaCreateImageBitmap() {
          if (typeof createImageBitmap !== 'function') {
            return Promise.reject(new Error('no-bitmap'));
          }
          // redimensiona na criação quando suportado
          var opts = { resizeWidth: MAX_SIDE, resizeHeight: MAX_SIDE, resizeQuality: 'high' };
          return createImageBitmap(file).then(function(bitmap) {
            try {
              var dataUrl = canvasFromImageSource(bitmap, bitmap.width, bitmap.height);
              if (bitmap.close) bitmap.close();
              return dataUrl;
            } catch (err) {
              if (bitmap.close) bitmap.close();
              throw err;
            }
          });
        }

        // Cadeia de fallbacks: bitmap → objectURL → FileReader
        loadViaCreateImageBitmap()
          .catch(function() { return loadViaObjectURL(); })
          .catch(function() { return loadViaFileReader(); })
          .then(function(dataUrl) {
            finishOk(dataUrl);
          })
          .catch(function(err) {
            console.error(err);
            finishErr('Esta foto não pôde ser processada neste aparelho. Tente outra ou converta para JPG.');
          });
      };

      const triggerUpload = function() {
        if (fileInputRef.current) fileInputRef.current.click();
      };

      const handleDownload = useCallback(async function(mode) {
        if (!photoUrl) {
          setError('Envie sua foto primeiro para gerar o post!');
          return;
        }
        if (!cardRef.current) return;
        mode = mode || 'feed';
        setPreviewMode(mode);
        setExporting(true);
        setError(null);
        try {
          // Aguarda React aplicar o fundo/proporção do modo (feed ou story)
          await new Promise(function(r) { setTimeout(r, 200); });
          var overlay = cardRef.current && cardRef.current.querySelector('.exporting-overlay');
          if (overlay) overlay.style.display = 'none';
          await new Promise(function(r) { setTimeout(r, 100); });

          var card = cardRef.current;
          var sourceCanvas = await html2canvas(card, {
            scale: 4,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#0a1628',
            logging: false,
            imageTimeout: 45000,
            ignoreElements: function(el) {
              return el.classList && el.classList.contains('exporting-overlay');
            }
          });

          // Instagram oficiais:
          // Story 9:16 = 1080x1920 | Feed retrato 4:5 = 1080x1350
          var targetW, targetH, fileSuffix;
          if (mode === 'story') {
            targetW = 1080; targetH = 1920; fileSuffix = 'story';
          } else {
            targetW = 1080; targetH = 1350; fileSuffix = 'feed';
          }

          var out = document.createElement('canvas');
          out.width = targetW;
          out.height = targetH;
          var ctx = out.getContext('2d');
          // Fundo azul do evento
          ctx.fillStyle = '#0a1628';
          ctx.fillRect(0, 0, targetW, targetH);

          var sw = sourceCanvas.width, sh = sourceCanvas.height;
          var dw, dh, dx, dy;

          // Card já está na proporção certa do modo → preenche o canvas de saída
          // Story: 9:16 exato com moldura dedicada | Feed: 4:5
          ctx.drawImage(sourceCanvas, 0, 0, targetW, targetH);

          var link = document.createElement('a');
          link.download = 'meu-post-seminario-penal-' + fileSuffix + '.png';
          link.href = out.toDataURL('image/png', 1.0);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) {
          console.error(err);
          setError('Erro ao gerar a imagem. Tente novamente.');
        } finally {
          setExporting(false);
        }
      }, [photoUrl]);

      const resetPhoto = function() {
        setPhotoUrl(null);
        setScale(1.1);
        setPosX(50);
        setPosY(38);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      var photoContent;
      if (photoUrl) {
        photoContent = h('img', {
          src: photoUrl, alt: 'Sua foto', className: 'photo-img',
          style: { transform: 'scale(' + scale + ')', WebkitTransform: 'scale(' + scale + ')', objectPosition: posX + '% ' + posY + '%', objectFit: 'cover' },
          draggable: false
        });
      } else if (processing) {
        photoContent = h('div', { className: 'placeholder' },
          h('div', { className: 'spinner', style: { width: '36px', height: '36px', marginBottom: '8px' } }),
          h('span', null, 'Processando foto...')
        );
      } else {
        photoContent = h('div', { className: 'placeholder' },
          h(CameraIcon),
          h('span', null, 'Toque aqui para', h('br'), 'enviar sua foto')
        );
      }

      var adjustPanel = null;
      if (photoUrl) {
        adjustPanel = h('div', { className: 'adjust-panel' },
          h('p', { className: 'adjust-title' }, 'Ajuste sua foto'),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Zoom'), h('span', null, Math.round(scale * 100) + '%')),
            h('input', { type: 'range', min: '1', max: '2.4', step: '0.05', value: scale,
              onChange: function(e) { setScale(parseFloat(e.target.value)); } })
          ),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Horizontal')),
            h('input', { type: 'range', min: '0', max: '100', step: '1', value: posX,
              onChange: function(e) { setPosX(parseInt(e.target.value, 10)); } })
          ),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Vertical')),
            h('input', { type: 'range', min: '0', max: '100', step: '1', value: posY,
              onChange: function(e) { setPosY(parseInt(e.target.value, 10)); } })
          )
        );
      }

      var secondaryBtn = photoUrl
        ? h('button', { className: 'btn-secondary', type: 'button', onClick: resetPhoto }, 'Trocar Foto')
        : h('label', {
            htmlFor: 'photo-upload-input',
            className: 'btn-secondary',
            style: { cursor: 'pointer' }
          }, 'Enviar Foto');

      return h('div', { className: 'page' },
        h('div', { className: 'header' },
          h('h1', null, 'Crie seu Post Personalizado'),
          h('p', null, '2ª Edição • Seminário Prático Penal Sul Capixaba 2026')
        ),
        h('div', { className: 'card-wrap' },
          h('div', {
            ref: cardRef,
            className: 'card-container' + (previewMode === 'story' ? ' card-story' : ' card-feed'),
            style: {
              aspectRatio: previewMode === 'story' ? '9 / 16' : '1199 / 1500',
              backgroundImage: previewMode === 'story'
                ? "url('background-story.jpg')"
                : "url('background.jpg')"
            }
          },
            h('img', {
              src: previewMode === 'story' ? 'background-story.jpg' : 'background.jpg',
              alt: '',
              className: 'bg-image',
              draggable: false,
              onError: function(e) {
                e.target.style.display = 'none';
                console.warn('Fundo nao carregou');
              }
            }),
            h('div', {
              className: 'photo-frame',
              role: photoUrl ? 'img' : 'button',
              'aria-label': photoUrl ? 'Área da foto' : 'Toque para enviar sua foto',
              style: previewMode === 'story' ? {
                top: '26%',
                width: '68%',
                left: '16%'
              } : undefined
            },
              photoContent,
              // Label invisível sobre o círculo: funciona no iOS/Android (melhor que click() JS)
              !photoUrl ? h('label', {
                htmlFor: 'photo-upload-input',
                className: 'photo-label',
                'aria-hidden': true
              }) : null
            ),
            h('div', {
              className: 'hashtag-outline',
              'aria-hidden': 'true',
              style: previewMode === 'story' ? { bottom: '18%' } : undefined
            }, '#EUVOU'),
            h('div', {
              className: 'hashtag',
              style: previewMode === 'story' ? { bottom: '18%' } : undefined
            }, '#EUVOU'),
                        exporting ? h('div', { className: 'exporting-overlay' },
              h('div', null, h('div', { className: 'spinner' }), h('p', null, 'Gerando seu post...'))
            ) : null
          )
        ),
        h('div', { className: 'controls' },
          error ? h('div', { className: 'error-box' }, error) : null,
          adjustPanel,
          h('div', { className: 'mode-toggle' },
            h('button', {
              type: 'button',
              className: 'mode-btn' + (previewMode === 'feed' ? ' mode-btn-active' : ''),
              onClick: function() { setPreviewMode('feed'); }
            }, 'Feed 4:5'),
            h('button', {
              type: 'button',
              className: 'mode-btn' + (previewMode === 'story' ? ' mode-btn-active' : ''),
              onClick: function() { setPreviewMode('story'); }
            }, 'Story 9:16')
          ),
          h('div', { className: 'btn-row btn-row-modes' },
            h('button', {
              className: 'btn-primary',
              type: 'button',
              onClick: function() { setPreviewMode('feed'); handleDownload('feed'); },
              disabled: !photoUrl || exporting
            }, h(DownloadIcon), 'Salvar Feed'),
            h('button', {
              className: 'btn-primary btn-story',
              type: 'button',
              onClick: function() { setPreviewMode('story'); handleDownload('story'); },
              disabled: !photoUrl || exporting
            }, h(DownloadIcon), 'Salvar Story')
          ),
          h('div', { className: 'btn-row' },
            secondaryBtn
          ),
          h('p', { className: 'privacy-note' },
            'Sua foto permanece apenas no seu dispositivo.', h('br'), 'Nada é enviado para servidores.'
          ),
          h('p', { className: 'dev-credit' },
            'Desenvolvido por ',
            h('a', {
              href: 'https://cora-devops.vercel.app/',
              target: '_blank',
              rel: 'noopener noreferrer',
              className: 'dev-link'
            }, 'Cora DevOps')
          )
        ),
        h('input', {
          ref: fileInputRef, id: 'photo-upload-input', type: 'file', accept: 'image/*,image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif',
          className: 'hidden-input', onChange: handleFileChange
        })
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
