<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seminário Prático Penal Sul Capixaba 2026 | Crie seu Post #EUVOU</title>
  <meta name="description" content="Crie seu post personalizado para o 2º Seminário Prático Penal Sul Capixaba 2026 em Cachoeiro de Itapemirim-ES." />
  <meta name="author" content="Agência Corazón Mídia & DevOps" />
  <meta name="theme-color" content="#0a1628" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(160deg, #06101f 0%, #0f1c33 40%, #0a1525 100%);
      min-height: 100vh;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 12px 40px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 380px;
      padding: 0 8px;
    }
    .header h1 {
      font-size: clamp(1.1rem, 4.5vw, 1.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .header p {
      font-size: clamp(0.7rem, 2.8vw, 0.875rem);
      color: #94a3b8;
      margin-top: 6px;
    }
    .card-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    .card-container {
      position: relative;
      width: 100%;
      max-width: min(420px, 94vw);
      aspect-ratio: 1080 / 1350;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.7);
      border-radius: 6px;
      overflow: hidden;
      background-color: #0a1628;
      background-size: 100% 100%;
      background-position: center center;
      background-repeat: no-repeat;
    }
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .photo-frame {
      position: absolute;
      left: 19.5%;
      top: 22.5%;
      width: 61%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      z-index: 20;
      cursor: pointer;
      border: 5px solid #d4af37;
      box-shadow:
        0 0 0 2px #f5e6a3,
        0 0 18px rgba(212, 175, 55, 0.55),
        inset 0 0 10px rgba(0,0,0,0.2);
      background: #0f172a;
      transition: box-shadow 0.2s ease, top 0.3s ease, width 0.3s ease, left 0.3s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-story .photo-frame {
      top: 23.5%;
      left: 16.5%;
      width: 67%;
    }
    .photo-frame:hover {
      box-shadow:
        0 0 0 2px #f5e6a3,
        0 0 24px rgba(212, 175, 55, 0.7),
        inset 0 0 10px rgba(0,0,0,0.2);
    }
    
    .photo-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .user-photo-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
      transform-origin: center center;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #1e293b, #0f172a);
      color: #e2e8f0;
      text-align: center;
      padding: 14px;
      gap: 10px;
    }
    .placeholder svg { width: 48px; height: 48px; opacity: 0.9; }
    .placeholder span {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      max-width: 85%;
    }

    .hashtag-outline,
    .hashtag {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(42px, 14vw, 68px);
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      font-family: 'Montserrat', Arial Black, sans-serif;
      transition: bottom 0.3s ease;
    }

    /* POSIÇÃO CORRIGIDA NO FEED (MAIS ABAIXO) */
    .card-feed .hashtag-outline,
    .card-feed .hashtag {
      bottom: 11%;
    }

    /* POSIÇÃO NO STORY (MAIS ALTA) */
    .card-story .hashtag-outline,
    .card-story .hashtag {
      bottom: 27.2%;
    }

    .hashtag-outline {
      z-index: 29;
      color: #ffffff;
      text-shadow:
        -3px -3px 0 #fff,
         3px -3px 0 #fff,
        -3px  3px 0 #fff,
         3px  3px 0 #fff,
        -3px  0   0 #fff,
         3px  0   0 #fff,
         0   -3px 0 #fff,
         0    3px 0 #fff,
        -2px -2px 0 #fff,
         2px -2px 0 #fff,
        -2px  2px 0 #fff,
         2px  2px 0 #fff;
    }
    .hashtag {
      z-index: 30;
      color: #0b1a2e;
      text-shadow: none;
      -webkit-text-stroke: 0;
    }

    .exporting-overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 16, 31, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 60;
      border-radius: 6px;
    }
    .exporting-overlay .spinner {
      width: 44px; height: 44px;
      border: 4px solid #facc15;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .exporting-overlay p { font-weight: 600; font-size: 14px; text-align: center; }
    .controls {
      width: 100%;
      max-width: 420px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 4px;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fecaca;
      font-size: 14px;
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
    }
    .adjust-panel {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .adjust-title {
      font-size: 11px;
      font-weight: 700;
      color: rgba(250, 204, 21, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-align: center;
    }
    .slider-row label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .slider-row label span:last-child { font-variant-numeric: tabular-nums; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      background: #d4af37;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.55);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px;
      background: #d4af37;
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 480px) {
      .btn-row { flex-direction: row; }
    }
    .btn-primary {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e0c35a 0%, #d4af37 45%, #b8860b 100%);
      color: #0f172a;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.45);
      transition: all 0.2s ease;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(212, 175, 55, 0.55);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary svg { width: 20px; height: 20px; flex-shrink: 0; }
    .btn-story {
      background: linear-gradient(135deg, #c084fc 0%, #a855f7 45%, #7c3aed 100%);
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.4);
      color: #fff;
    }
    .btn-story:hover:not(:disabled) {
      box-shadow: 0 8px 22px rgba(168, 85, 247, 0.55);
    }
    .mode-toggle {
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 12px;
      padding: 4px;
    }
    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn-active {
      background: linear-gradient(135deg, #d4af37, #b8860b);
      color: #0f172a;
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.35);
    }
    .card-story {
      max-width: min(360px, 88vw) !important;
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 12px;
      background: transparent;
      border: 2px solid #d4af37;
      color: #d4af37;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover { background: rgba(212, 175, 55, 0.12); }
    .privacy-note {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
      padding-top: 4px;
    }
    .dev-credit {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-top: 8px;
      padding-bottom: 8px;
    }
    .dev-link {
      color: #d4af37;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .dev-link:hover {
      color: #f0d68c;
      border-bottom-color: #d4af37;
    }
    .hidden-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
      opacity: 0;
    }
    .photo-label {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      cursor: pointer;
      z-index: 35;
      display: block;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const { useState, useRef, useCallback, createElement: h } = React;

    function CameraIcon() {
      return h('svg', { xmlns: 'http://www.w3.org/2000/svg', fill: 'none', viewBox: '0 0 24 24', strokeWidth: 1.5, stroke: 'currentColor' },
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.055-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z' }),
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z' })
      );
    }

    function DownloadIcon() {
      return h('svg', { xmlns: 'http://www.w3.org/2000/svg', fill: 'none', viewBox: '0 0 24 24', stroke: 'currentColor', strokeWidth: 2.5 },
        h('path', { strokeLinecap: 'round', strokeLinejoin: 'round', d: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4' })
      );
    }

    const DEFAULT_ZOOM = 1.0;

    function App() {
      const [photoUrl, setPhotoUrl] = useState(null);
      const [scale, setScale] = useState(DEFAULT_ZOOM);
      const [posX, setPosX] = useState(50);
      const [posY, setPosY] = useState(50);
      const [previewMode, setPreviewMode] = useState('feed');
      const [exporting, setExporting] = useState(false);
      const [processing, setProcessing] = useState(false);
      const [error, setError] = useState(null);
      const cardRef = useRef(null);
      const fileInputRef = useRef(null);

      const handleFileChange = function(e) {
        var inputEl = e.target;
        var file = inputEl.files && inputEl.files[0];
        try { inputEl.value = ''; } catch (err) {}
        if (!file) return;

        setError(null);
        setProcessing(true);

        function isProbablyHeic(f) {
          var t = (f.type || '').toLowerCase();
          var n = (f.name || '').toLowerCase();
          return t.indexOf('heic') >= 0 || t.indexOf('heif') >= 0 || /\.heic$|\.heif$/i.test(n);
        }

        function ensureDecodableFile(f) {
          if (!isProbablyHeic(f) || typeof heic2any === 'undefined') {
            return Promise.resolve(f);
          }
          return heic2any({ blob: f, toType: 'image/jpeg', quality: 0.95 })
            .then(function(result) {
              var blob = Array.isArray(result) ? result[0] : result;
              return new File([blob], (f.name || 'foto').replace(/\.heic$/i, '.jpg').replace(/\.heif$/i, '.jpg'), { type: 'image/jpeg' });
            })
            .catch(function(err) {
              console.warn('heic2any fail', err);
              return f;
            });
        }

        function applyPhoto(dataUrl) {
          if (!dataUrl) {
            setProcessing(false);
            setError('Não foi possível carregar esta foto. Tente outra.');
            return;
          }
          var testImg = new Image();
          testImg.onload = function() {
            setPhotoUrl(dataUrl);
            setScale(DEFAULT_ZOOM);
            setPosX(50);
            setPosY(50);
            setProcessing(false);
            setError(null);
          };
          testImg.onerror = function() {
            setProcessing(false);
            setError('Falha ao renderizar imagem.');
          };
          testImg.src = dataUrl;
        }

        ensureDecodableFile(file).then(function(decodedFile) {
          var reader = new FileReader();
          reader.onload = function(ev) {
            applyPhoto(ev.target.result);
          };
          reader.onerror = function() {
            setProcessing(false);
            setError('Erro ao ler arquivo de foto.');
          };
          reader.readAsDataURL(decodedFile);
        }).catch(function() {
          setProcessing(false);
          setError('Não foi possível processar a foto.');
        });
      };

      const handleDownload = useCallback(async function(mode) {
        if (!photoUrl) {
          setError('Envie sua foto primeiro para gerar o post!');
          return;
        }
        if (!cardRef.current) return;
        mode = mode || 'feed';
        setPreviewMode(mode);
        setExporting(true);
        setError(null);

        try {
          await new Promise(function(r) { setTimeout(r, 200); });
          var card = cardRef.current;
          
          var sourceCanvas = await html2canvas(card, {
            scale: 3.2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#0a1628',
            logging: false,
            imageTimeout: 60000,
            ignoreElements: function(el) {
              return el.classList && el.classList.contains('exporting-overlay');
            }
          });

          var fileSuffix = mode === 'story' ? 'story' : 'feed';
          var link = document.createElement('a');
          link.download = 'meu-post-seminario-penal-' + fileSuffix + '.png';
          link.href = sourceCanvas.toDataURL('image/png', 1.0);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) {
          console.error(err);
          setError('Erro ao gerar a imagem. Tente novamente.');
        } finally {
          setExporting(false);
        }
      }, [photoUrl]);

      const resetPhoto = function() {
        setPhotoUrl(null);
        setScale(DEFAULT_ZOOM);
        setPosX(50);
        setPosY(50);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      var shiftX = (posX - 50) * 1.5;
      var shiftY = (posY - 50) * 1.5;

      var photoContent;
      if (photoUrl) {
        photoContent = h('div', { className: 'photo-wrapper' },
          h('img', {
            src: photoUrl,
            alt: 'Foto do participante',
            className: 'user-photo-img',
            style: {
              transform: 'translate(' + shiftX + '%, ' + shiftY + '%) scale(' + scale + ')',
              WebkitTransform: 'translate(' + shiftX + '%, ' + shiftY + '%) scale(' + scale + ')'
            }
          })
        );
      } else if (processing) {
        photoContent = h('div', { className: 'placeholder' },
          h('div', { className: 'spinner', style: { width: '36px', height: '36px', marginBottom: '8px' } }),
          h('span', null, 'Processando foto...')
        );
      } else {
        photoContent = h('div', { className: 'placeholder' },
          h(CameraIcon),
          h('span', null, 'Toque aqui para', h('br'), 'enviar sua foto')
        );
      }

      var adjustPanel = null;
      if (photoUrl) {
        adjustPanel = h('div', { className: 'adjust-panel' },
          h('p', { className: 'adjust-title' }, 'Ajuste Fino (Opcional)'),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Zoom'), h('span', null, Math.round(scale * 100) + '%')),
            h('input', { type: 'range', min: '0.5', max: '3.0', step: '0.05', value: scale,
              onChange: function(e) { setScale(parseFloat(e.target.value)); } })
          ),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Horizontal')),
            h('input', { type: 'range', min: '0', max: '100', step: '1', value: posX,
              onChange: function(e) { setPosX(parseInt(e.target.value, 10)); } })
          ),
          h('div', { className: 'slider-row' },
            h('label', null, h('span', null, 'Vertical')),
            h('input', { type: 'range', min: '0', max: '100', step: '1', value: posY,
              onChange: function(e) { setPosY(parseInt(e.target.value, 10)); } })
          )
        );
      }

      var secondaryBtn = photoUrl
        ? h('button', { className: 'btn-secondary', type: 'button', onClick: resetPhoto }, 'Trocar Foto')
        : h('label', {
            htmlFor: 'photo-upload-input',
            className: 'btn-secondary',
            style: { cursor: 'pointer' }
          }, 'Enviar Foto');

      return h('div', { className: 'page' },
        h('div', { className: 'header' },
          h('h1', null, 'Crie seu Post Personalizado'),
          h('p', null, '2ª Edição • Seminário Prático Penal Sul Capixaba 2026')
        ),
        h('div', { className: 'card-wrap' },
          h('div', {
            ref: cardRef,
            className: 'card-container' + (previewMode === 'story' ? ' card-story' : ' card-feed'),
            style: {
              aspectRatio: previewMode === 'story' ? '9 / 16' : '1080 / 1350',
              backgroundImage: previewMode === 'story'
                ? "url('background-story-1080.jpg')"
                : "url('background.jpg')"
            }
          },
            h('img', {
              src: previewMode === 'story' ? 'background-story-1080.jpg' : 'background.jpg',
              alt: '',
              className: 'bg-image',
              draggable: false,
              onError: function(e) {
                e.target.style.display = 'none';
              }
            }),
            h('div', {
              className: 'photo-frame',
              role: photoUrl ? 'img' : 'button',
              'aria-label': photoUrl ? 'Área da foto' : 'Toque para enviar sua foto'
            },
              photoContent,
              !photoUrl ? h('label', {
                htmlFor: 'photo-upload-input',
                className: 'photo-label',
                'aria-hidden': true
              }) : null
            ),
            h('div', { className: 'hashtag-outline' }, '#EUVOU'),
            h('div', { className: 'hashtag' }, '#EUVOU'),

            exporting ? h('div', { className: 'exporting-overlay' },
              h('div', { className: 'spinner' }),
              h('p', null, 'Gerando imagem em alta resolução...')
            ) : null
          )
        ),

        h('input', {
          id: 'photo-upload-input',
          ref: fileInputRef,
          type: 'file',
          accept: 'image/*,.heic,.heif',
          className: 'hidden-input',
          onChange: handleFileChange
        }),

        h('div', { className: 'controls' },
          error ? h('div', { className: 'error-box' }, error) : null,
          
          adjustPanel,

          h('div', { className: 'mode-toggle' },
            h('button', {
              className: 'mode-btn' + (previewMode === 'feed' ? ' mode-btn-active' : ''),
              type: 'button',
              onClick: function() { setPreviewMode('feed'); }
            }, 'Formato Feed (4:5)'),
            h('button', {
              className: 'mode-btn' + (previewMode === 'story' ? ' mode-btn-active' : ''),
              type: 'button',
              onClick: function() { setPreviewMode('story'); }
            }, 'Formato Story (9:16)')
          ),

          h('div', { className: 'btn-row' },
            h('button', {
              className: 'btn-primary' + (previewMode === 'story' ? ' btn-story' : ''),
              type: 'button',
              disabled: !photoUrl || exporting,
              onClick: function() { handleDownload(previewMode); }
            },
              h(DownloadIcon),
              exporting ? 'Aguarde...' : ('Baixar Post (' + (previewMode === 'story' ? 'Story' : 'Feed') + ')')
            ),
            secondaryBtn
          ),

          h('p', { className: 'privacy-note' },
            'Sua foto é processada com total segurança diretamente no seu dispositivo.'
          ),
          h('div', { className: 'dev-credit' },
            'Desenvolvido por ',
            h('a', {
              href: 'https://cora-devops.vercel.app/',
              target: '_blank',
              rel: 'noopener noreferrer',
              className: 'dev-link'
            }, 'Cora DevOps')
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
